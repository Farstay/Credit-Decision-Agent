services:
  # --- PostgreSQL: основная база данных ---
  postgres:
    image: postgres:16
    container_name: credit_postgres
    environment:
      POSTGRES_USER: credit_user
      POSTGRES_PASSWORD: credit_pass
      POSTGRES_DB: credit_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit_user -d credit_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Qdrant: векторная база для RAG ---
  qdrant:
    image: qdrant/qdrant:latest
    container_name: credit_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data: